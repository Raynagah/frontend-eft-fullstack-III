version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue_vite_frontend
    ports:
      - "5173:5173"
    volumes:
      # Sincroniza tu código local con la carpeta /app del contenedor (Hot-Reload)
      - .:/app
      # Crea un volumen anónimo para node_modules para no interferir con tu sistema local
      - /app/node_modules
    environment:
      # Variable útil si estás usando Windows/WSL para asegurar que Vite detecte los cambios de archivos
      - CHOKIDAR_USEPOLLING=true